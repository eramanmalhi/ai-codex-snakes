<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Snake</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hud" aria-label="Game status">
        <div class="hud-item"><span>Player</span><strong id="playerName">-</strong></div>
        <div class="hud-item"><span>Score</span><strong id="score">0</strong></div>
        <div class="hud-item"><span>High Score</span><strong id="highScore">0</strong></div>
        <div class="hud-item"><span>Difficulty</span><strong id="difficulty">Easy</strong></div>
      </header>

      <main class="game-area">
        <canvas id="gameCanvas" width="600" height="600" aria-label="Snake game canvas"></canvas>
        <aside class="side-panel">
          <section class="powerup-panel">
            <h2>Active Powerups</h2>
            <ul id="activePowerups"></ul>
          </section>
          <div class="button-row">
            <button id="pauseBtn" type="button">Pause</button>
            <button id="soundToggleBtn" type="button">Sound: Off</button>
            <button id="darkModeBtn" type="button">Dark Mode</button>
          </div>
          <p class="help">Desktop: Arrow keys or WASD • Mobile: Swipe anywhere on game area</p>
        </aside>
      </main>
    </div>

    <div id="startModal" class="modal show" role="dialog" aria-modal="true" aria-labelledby="startTitle">
      <div class="modal-content">
        <h1 id="startTitle">Start Modern Snake</h1>
        <form id="startForm">
          <label for="playerInput">Player Name</label>
          <input id="playerInput" name="player" type="text" maxlength="20" placeholder="Enter name" required />

          <label for="difficultyInput">Difficulty</label>
          <select id="difficultyInput" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>

          <button type="submit">Start Game</button>
        </form>
      </div>
    </div>

    <div id="gameOverModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="modal-content">
        <h2 id="gameOverTitle">Game Over</h2>
        <p id="gameOverMessage">Final score: 0</p>
        <div class="button-row">
          <button id="restartBtn" type="button">Restart</button>
          <button id="playAgainBtn" type="button">Play Again</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
